[project]

name = "utrace"
version = "0.1.0"
description = "Uncertainty Tracking for Complex Estimators"

license = "MIT"
authors = [
    {name="Edgardo Marchi", email="edgardo.marchi@gmail.com"}
]

readme = "README.md"

keywords = ["Uncertainty Quantification", "AI", "Metrology"]

classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

requires-python = ">=3.11,<3.15"

dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]",
]
rocm7-local = [
    "jax[rocm7-local]",
]
viz = [
    "matplotlib",
    "pandas",
]
examples = [
    "torch",
    "torchvision",
]
acdc = [
    "monai",
    "nibabel",
]

[project.urls]
homepage = "https://github.com/edgardomarchi/utrace"
documentation = "https://github.com/edgardomarchi/utrace/-/tree/main/docs"
repository = "https://github.com/edgardomarchi/utrace"

[tool.uv]
conflicts = [
    [
        { group = "dev" },
        { group = "dev-cuda13" },
        { group = "dev-rocm7" }
    ],
    [
        { extra = "examples" },
        { group = "dev-cuda13" }
    ],
    [
        { extra = "examples" },
        { group = "dev-rocm7" }
    ]
]

required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", group = "dev" },
    { index = "torch-cu130", group = "dev-cuda13" },
    { index = "torch-rocm72", group = "dev-rocm7" },
    { index = "torch-cpu", extra = "examples" }
]

torchvision = [
    { index = "torch-cpu", group = "dev" },
    { index = "torch-cu130", group = "dev-cuda13" },
    { index = "torch-rocm72", group = "dev-rocm7" },
    { index = "torch-cpu", extra = "examples" }
]

triton-rocm = [
    { index = "torch-rocm72", group = "dev-rocm7" }
]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
# pytest and its plugins are their own group, not part of dev/dev-cuda13/dev-rocm7, so an
# environment can run tests/core/ (torch-free by convention) without installing torch. All three
# dev groups include this group (`{include-group = "test"}`) rather than duplicating its
# contents - see .reports/2026-08-19_pytest_group_split.md for why pytest-cov had to move here
# too, not just pytest itself: pyproject.toml's own [tool.pytest.ini_options] addopts references
# --cov-report/--no-cov flags that only exist once pytest-cov is installed, so an environment
# missing it can't even collect tests, regardless of whether coverage is actually wanted.
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "torch",
    "torchvision",

    # Linters
    "mypy",
    "ruff",

    # Testing
    {include-group = "test"},

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "nibabel",
    "scikit-learn",
]
dev-cuda13 = [
    "torch",
    "torchvision",

    # Linters
    "mypy",
    "ruff",

    # Testing
    {include-group = "test"},

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "nibabel",
    "scikit-learn",
]
dev-rocm7 = [
    "torch",
    "torchvision",
    "triton-rocm",

    # Linters
    "mypy",
    "ruff",

    # Testing
    {include-group = "test"},

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "nibabel",
    "scikit-learn",
]


[project.scripts]

utrace = "utrace.cli:main"

[tool.ruff.lint.per-file-ignores]
# Names imported into an __init__.py purely to form the package's public API surface, never
# used by name within the __init__.py itself. Ignoring F401 for __init__.py is the standard
# convention (ruff's own docs recommend it), not a suppression of a real finding - these are
# re-exports, not dead imports.
"__init__.py" = ["F401"]

[tool.mypy]

ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

cache_dir = ".cache/mypy/"

[tool.pytest.ini_options]

addopts = """
--strict-markers

-r sxX
--show-capture=log

--cov-report=html
--cov-report=term-missing:skip-covered
--no-cov-on-fail
"""

cache_dir = ".cache/pytest/"

markers = []

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"
