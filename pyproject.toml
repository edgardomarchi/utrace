[project]

name = "utrace"
version = "0.0.1"
description = "Uncertainty Tracking for Complex Estimators"

license = "MIT"
authors = [
    {name="Edgardo Marchi", email="edgardo.marchi@gmail.com"}
]

readme = "README.md"

keywords = ["Uncertainty Quantification", "AI", "Metrology"]

classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

requires-python = ">=3.11,<3.15"

dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]",
]
rocm7-local = [
    "jax[rocm7-local]",
]
viz = [
    "matplotlib",
    "pandas",
]
examples = [
    "torch",
    "torchvision",
    "monai",
    "nibabel",
]

[project.urls]
homepage = "https://github.com/edgardomarchi/utrace"
documentation = "https://github.com/edgardomarchi/utrace/-/tree/main/docs"
repository = "https://github.com/edgardomarchi/utrace"

[tool.uv]
conflicts = [
    [
        { group = "dev" },
        { group = "dev-cuda13" },
        { group = "dev-rocm7" }
    ],
    [
        { extra = "examples" },
        { group = "dev-cuda13" }
    ],
    [
        { extra = "examples" },
        { group = "dev-rocm7" }
    ]
]

required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", group = "dev" },
    { index = "torch-cu130", group = "dev-cuda13" },
    { index = "torch-rocm72", group = "dev-rocm7" },
    { index = "torch-cpu", extra = "examples" }
]

torchvision = [
    { index = "torch-cpu", group = "dev" },
    { index = "torch-cu130", group = "dev-cuda13" },
    { index = "torch-rocm72", group = "dev-rocm7" },
    { index = "torch-cpu", extra = "examples" }
]

triton-rocm = [
    { index = "torch-rocm72", group = "dev-rocm7" }
]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "torch",
    "torchvision",

    "ipykernel",
    "jupytext",

    # Formatters
    "black",
    "tomli",
    "isort",

    # Linters
    "mypy",
    "pydocstyle",
    "pylint",
    "pylint-pytest",
    "wrapt",

    # Testing
    "pytest",
    "pytest-describe",
    "pytest-expecter",
    "pytest-random",
    "pytest-cov",
    "freezegun",

    # Reports
    "coveragespace",

    # Documentation
    "mkdocs",
    "pygments",

    # Tooling
    "pre-commit",
    "bump2version",
    "pyinstaller",
    "sniffer",
    "MacFSEvents; sys_platform == 'darwin'",
    "pync; sys_platform == 'darwin'",
    "ipython",

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "monai",
    "nibabel",
    "scikit-learn",
]
dev-cuda13 = [
    "torch",
    "torchvision",

    "ipykernel",
    "jupytext",

    # Formatters
    "black",
    "tomli",
    "isort",

    # Linters
    "mypy",
    "pydocstyle",
    "pylint",
    "pylint-pytest",
    "wrapt",

    # Testing
    "pytest",
    "pytest-describe",
    "pytest-expecter",
    "pytest-random",
    "pytest-cov",
    "freezegun",

    # Reports
    "coveragespace",

    # Documentation
    "mkdocs",
    "pygments",

    # Tooling
    "pre-commit",
    "bump2version",
    "pyinstaller",
    "sniffer",
    "MacFSEvents; sys_platform == 'darwin'",
    "pync; sys_platform == 'darwin'",
    "ipython",

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "monai",
    "nibabel",
    "scikit-learn",
]
dev-rocm7 = [
    "torch",
    "torchvision",
    "triton-rocm",

    "ipykernel",
    "jupytext",

    # Formatters
    "black",
    "tomli",
    "isort",

    # Linters
    "mypy",
    "pydocstyle",
    "pylint",
    "pylint-pytest",
    "wrapt",

    # Testing
    "pytest",
    "pytest-describe",
    "pytest-expecter",
    "pytest-random",
    "pytest-cov",
    "freezegun",

    # Reports
    "coveragespace",

    # Documentation
    "mkdocs",
    "pygments",

    # Tooling
    "pre-commit",
    "bump2version",
    "pyinstaller",
    "sniffer",
    "MacFSEvents; sys_platform == 'darwin'",
    "pync; sys_platform == 'darwin'",
    "ipython",

    # Framework helpers (utils/pytorch/*, scripts/) - not needed by the core
    "monai",
    "nibabel",
    "scikit-learn",
]


[project.scripts]

utrace = "utrace.cli:main"

[tool.black]

quiet = true

[tool.isort]

profile = "black"

[tool.mypy]

ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

cache_dir = ".cache/mypy/"

[tool.pytest.ini_options]

addopts = """
--strict-markers

-r sxX
--show-capture=log

--cov-report=html
--cov-report=term-missing:skip-covered
--no-cov-on-fail
"""

cache_dir = ".cache/pytest/"

markers = []

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
